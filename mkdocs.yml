site_name: Méthode Foyer
site_description: >-
  Cadre d'agents pour un logiciel sobre, durable et transmissible —
  Manifeste, méthode, skills, personas et supports pédagogiques.
site_author: Gilles Maury
site_url: https://gilmry.github.io/foyer/
copyright: >-
  © Gilles Maury — dérivé du Manifeste Maury (CC BY-SA 4.0).

repo_url: https://github.com/gilmry/foyer
repo_name: gilmry/foyer
edit_uri: ""

# Le contenu est assemblé au build dans .build/docs/ via scripts/mkdocs_sync.py :
# les .md de la racine, skills/, personas/, bmad/, tools/ et les médias
# notebooklm/ y sont copiés. Deux pages sont générées :
# supports.md par scripts/gen_supports.py, gates-templates.md par
# scripts/gen_gates.py (les templates sont des .yml.example, que MkDocs ne
# rendrait pas comme des pages).
docs_dir: .build/docs
use_directory_urls: false

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.emoji
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.arithmatex
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.betterem
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - toc:
      permalink: true

plugins:
  - awesome-pages:
      collapse_single_pages: true
  - search:
      lang: fr
  - open-in-new-tab:
      add_icon: true


hooks:
  - scripts/mkdocs_sync.py
