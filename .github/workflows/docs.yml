name: Documentation

# Construit le site MkDocs Material et le publie sur GitHub Pages.
# Prérequis (une seule fois) : Settings → Pages → Source = "GitHub Actions".
#
# Actions épinglées par SHA (tag en commentaire), comme l'exige la règle que
# ce dépôt publie — voir tools/gates/TOOLS.md § Épinglage. Ne pas revenir à
# un tag mobile : c'est le seul workflow que ce dépôt exécute réellement, il
# doit tenir ce qu'il documente. Mise à jour des SHA : cercle de réexamen de
# tools/gates/ADR-outillage.md.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "notebooklm/**"
      # Les templates de gates sont des .yml.example : le filtre **/*.md
      # ci-dessus ne les attrape pas, d'où cette entrée dédiée.
      - "tools/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/gen_supports.py"
      - "scripts/gen_gates.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Installer MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Construire le site
        run: mkdocs build

      - name: Téléverser l'artefact Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
